<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <!-- subtle stars -->
    <g opacity="0.35">
      <circle cx="250" cy="240" r="3" fill="white"/>
      <circle cx="320" cy="180" r="2" fill="white"/>
      <circle cx="700" cy="230" r="2.5" fill="white"/>
      <circle cx="600" cy="170" r="2" fill="white"/>
    </g>
    <!-- crescent moon -->
    <g transform="translate(680,220) scale(1.1)">
      <circle cx="0" cy="0" r="70" fill="white" opacity="0.95"/>
      <circle cx="25" cy="-10" r="70" fill="url(#bg)"/>
    </g>
    <!-- sound wave -->
    <path d="M120 580 
             C 220 580, 240 500, 320 500
             C 400 500, 418 700, 480 700
             C 542 700, 564 420, 628 420
             C 692 420, 720 680, 800 680
             C 880 680, 900 560, 904 560"
          fill="none" stroke="white" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- rounded border overlay -->
    <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="white" opacity="0.07" stroke-width="8"/>
  </g>
</svg>
